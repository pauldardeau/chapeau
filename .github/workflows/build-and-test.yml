name: Build and test
on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SQLite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: make chaudiere
        run: make
        working-directory: chaudiere/src
      - name: make library
        # serial - see README's Building section for why -j isn't safe here
        run: make
        working-directory: src
      - name: make tests
        run: make
        working-directory: tests
      - name: run-tests
        run: LD_LIBRARY_PATH=../chaudiere/src ./test_chapeau
        working-directory: tests

  cmake-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install SQLite3
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev
      - name: Configure
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
